name: Feature checks

# Fast validation for every feature branch, integration branch, and pull
# request. Packaging, attestations, and release artifacts stay in ci.yaml and
# release.yaml, which only run after changes land on main.
on:
  push:
    branches:
      - '**'
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: feature-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config zip \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libsamplerate0-dev libgl1-mesa-dev zlib1g-dev

      - name: Run host tests
        run: make -C tests test

  tg5040-build:
    name: tg5040 target build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      PLATFORM: tg5040
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup
        run: make setup

      - name: Build tg5040 target
        run: make build PLATFORM=tg5040

      - name: Verify target binaries
        run: |
          find workspace -path '*/build/tg5040/*.elf' -type f -printf '%p %s bytes\n' | sort
          test -f workspace/all/nextui/build/tg5040/nextui.elf
          test -f workspace/all/settings/build/tg5040/settings.elf
          test -f workspace/all/devserv/build/tg5040/devserv.elf
          test -f workspace/all/nextdev/build/tg5040/nextdev.elf
          test -f workspace/all/netdebug/build/tg5040/netdebug.elf
          test -f workspace/tg5040/keymon/keymon.elf

      # Transactional update package content, reusing the tree built above.
      # Test-only: the archive is unsigned, the version is a placeholder, and
      # nothing is published.
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip zlib1g-dev

      - name: Stage the system and boot payload
        run: |
          make system PLATFORM=tg5040
          make special

      - name: Package the transactional update archive
        run: |
          # The toolchain container built workspace/ as root, so the host
          # nextupd build needs a writable build directory.
          sudo mkdir -p workspace/all/nextupd/build/desktop
          sudo chown -R "$(id -u):$(id -g)" workspace/all/nextupd/build
          make update-package PLATFORM=tg5040 UPDATE_VERSION=v0.0.0

      # The content contract on the archive this job built: exact roots, the
      # device layout, executable boot tools, and every shared resource file
      # with its hash against skeleton/SYSTEM/res. Directory entries in the ZIP
      # are not files and do not count toward the 71 resources.
      - name: Verify package content
        run: |
          python3 scripts/verify_update_package.py \
            --archive releases/nextui-system-tg5040.zip \
            --platform tg5040 \
            --version v0.0.0 \
            --res-source skeleton/SYSTEM/res \
            --expect-res-count 71

      # A content check that accepts everything would pass the step above, so
      # each defect is injected into a copy of the real archive and must be
      # rejected: a missing boot tool, a non-executable boot tool, a missing or
      # changed resource, a wrong layout, a missing launcher, and a bootstrap
      # root the installer refuses.
      - name: Verify the content check rejects defective packages
        run: |
          python3 tests/verify_update_package_negative_test.py \
            --archive releases/nextui-system-tg5040.zip \
            --verifier scripts/verify_update_package.py \
            --platform tg5040 \
            --version v0.0.0 \
            --res-source skeleton/SYSTEM/res \
            --expect-res-count 71

      - name: Upload target binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tg5040-target-${{ github.sha }}
          # keymon is built by workspace/tg5040/keymon/makefile into its own
          # directory (no build/ subdirectory), so the build-tree glob alone
          # never matched it. Keep both paths: the device test replaces
          # keymon.elf alone.
          path: |
            workspace/**/build/tg5040/*.elf
            workspace/tg5040/keymon/keymon.elf
          if-no-files-found: error
          retention-days: 7
