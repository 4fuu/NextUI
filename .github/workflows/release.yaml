---
name: Release NextUI

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "release type"
        default: "patch"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      next-tag: ${{ steps.next-tag.outputs.version }}
      release-name: ${{ steps.release-name.outputs.RELEASE_NAME }}
      latest-tag: ${{ steps.latest-tag.outputs.GIT_LATEST_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Release Name
        id: release-name
        run: |
          echo "RELEASE_NAME=$(make name)" >> "$GITHUB_OUTPUT"

      - name: Get Latest Tag
        id: latest-tag
        run: |
          echo GIT_LATEST_TAG="$(git describe --tags "$(git rev-list --tags --max-count=1)")" >>"$GITHUB_OUTPUT"

      - name: Compute Next Tag
        id: next-tag
        uses: docker://ghcr.io/dokku/semver-generator:latest
        with:
          bump: ${{ github.event.inputs.release_type }}
          input: ${{ steps.latest-tag.outputs.GIT_LATEST_TAG }}

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_NAME: ${{ needs.prepare.outputs.release-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The update source is this repository's signed GitHub Releases assets, so
      # a release cannot be published without the production signing key. Fail
      # before any build work instead of publishing a release whose update
      # assets are missing or unsigned. The key never appears in this file, in
      # the repository, or in any log; see RELEASE-SOURCE.md for the custody and
      # injection chain.
      - name: Check the signing key is configured
        env:
          NEXTUI_RELEASE_SIGNING_KEY: ${{ secrets.NEXTUI_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$NEXTUI_RELEASE_SIGNING_KEY" ]; then
            echo "::error title=No signing key::NEXTUI_RELEASE_SIGNING_KEY is not set for this repository. Store the production signing key in the confidential facility and copy it into this repository's Actions secrets (RELEASE-SOURCE.md), then re-run. Refusing to publish a release without a signed update source." >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipmerge

      - name: Setup
        run: make setup

      - name: Build (tg5040)
        run: make tg5040
        env:
          PLATFORM: tg5040

      - name: Build (tg5050)
        run: make tg5050
        env:
          PLATFORM: tg5050

      - name: Build (h700)
        run: make h700
        env:
          PLATFORM: h700

      - name: Special
        run: make special

      # The signed update source: one package set per platform plus the feed,
      # built through the same entries the packaging tests drive. It runs before
      # `make package`, which moves build/SYSTEM into the bootstrap payload.
      # The script signs with the key from the environment, verifies every
      # signature against the committed public sidecar, and writes nothing
      # uploadable when any check fails, so an unsigned set never reaches the
      # release page.
      - name: Prepare the signed update assets
        env:
          NEXTUI_RELEASE_SIGNING_KEY: ${{ secrets.NEXTUI_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.next-tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.latest-tag }}
          SERVER_URL: ${{ github.serverUrl }}
          REPOSITORY: ${{ github.repository }}
          UPDATE_PUBLIC_KEY: workspace/all/nextupd/release/*.pub
        run: |
          previous_args=""
          min_system="$RELEASE_TAG"
          if [ -n "$PREVIOUS_TAG" ]; then
            previous_args="--previous-url $SERVER_URL/$REPOSITORY/releases/download/$PREVIOUS_TAG/nextui-feed.json"
            # A card on the previous release can install this one; a card older
            # than that updates through the previous release's row, which the
            # merged feed keeps. For a first release the floor is the release
            # itself.
            min_system="$PREVIOUS_TAG"
          fi
          # shellcheck disable=SC2086
          scripts/prepare-release-update-assets.sh \
            --version "$RELEASE_TAG" \
            --min-system "$min_system" \
            --key-env NEXTUI_RELEASE_SIGNING_KEY \
            --public-key $UPDATE_PUBLIC_KEY \
            --base-url "$SERVER_URL/$REPOSITORY/releases/download/$RELEASE_TAG" \
            $previous_args \
            --out-dir releases/update

      - name: Package
        run: make package

      - name: Upload All
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_NAME }}-all.zip
          path: releases/${{ env.RELEASE_NAME }}-all.zip

      - name: Upload Base
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_NAME }}-base.zip
          path: releases/${{ env.RELEASE_NAME }}-base.zip

      - name: Upload Extras
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_NAME }}-extras.zip
          path: releases/${{ env.RELEASE_NAME }}-extras.zip

      # The signed update assets: the per-platform sets and the feed. The
      # release job's existing download pattern (NextUI-*) picks this artifact
      # up and attaches its contents to the release beside the bootstrap
      # archives.
      - name: Upload Update Assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_NAME }}-update-assets.zip
          path: releases/update

      - name: Skip Attest for PRs from forks
        id: skip
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::warning title=Attest skipped::Attest action requires permissions and is performed only for main branch.'

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4.2.2
        if: github.ref == 'refs/heads/main'
        with:
          subject-path: |
            releases/${{ env.RELEASE_NAME }}-all.zip
            releases/${{ env.RELEASE_NAME }}-base.zip
            releases/${{ env.RELEASE_NAME }}-extras.zip
            releases/update/nextui-feed.json
            releases/update/nextui-system-*.zip
            releases/update/nextui-system-*.manifest.json
            releases/update/nextui-system-*.manifest.sig

  release:
    needs:
      - build
      - prepare
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download Release Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: releases/
          pattern: NextUI-*
          merge-multiple: true

      - name: Create and Push Tag
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag "$GIT_NEXT_TAG"
          git push origin "$GIT_NEXT_TAG"
        env:
          GIT_NEXT_TAG: ${{ needs.prepare.outputs.next-tag }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/*
          generate_release_notes: true
          append_body: true
          tag_name: ${{ needs.prepare.outputs.next-tag }}
          make_latest: "true"
          body: |
            
            For full features list and help on how to use etc of NextUI:
            https://nextui.loveretro.games/docs/

            ## How to install/update
            For a fresh installation, follow the instructions here: https://nextui.loveretro.games/getting-started/installation/
            When updating from a previous release: https://nextui.loveretro.games/getting-started/updating/
