---
name: Release NextUI

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "release type"
        default: "patch"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      next-tag: ${{ steps.release-tag.outputs.version }}
      release-name: ${{ steps.release-name.outputs.RELEASE_NAME }}
      latest-tag: ${{ steps.latest-tag.outputs.GIT_LATEST_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Release Name
        id: release-name
        run: |
          echo "RELEASE_NAME=$(make name)" >> "$GITHUB_OUTPUT"

      # No tags is the first-release case: `git describe` would fail here, so
      # the empty result is explicit and the first version comes from the
      # authoritative version source below.
      - name: Get Latest Tag
        id: latest-tag
        run: |
          if git rev-list --tags --max-count=1 | grep -q .; then
            echo "GIT_LATEST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)")" >>"$GITHUB_OUTPUT"
          else
            echo "GIT_LATEST_TAG=" >>"$GITHUB_OUTPUT"
            echo "::notice title=First release::No tags exist yet; the first version comes from the VERSION file."
          fi

      - name: Compute Next Tag
        id: next-tag
        if: steps.latest-tag.outputs.GIT_LATEST_TAG != ''
        uses: docker://ghcr.io/dokku/semver-generator:latest
        with:
          bump: ${{ github.event.inputs.release_type }}
          input: ${{ steps.latest-tag.outputs.GIT_LATEST_TAG }}

      # The first release is named by the authoritative version source; no
      # date-to-version mapping is invented and the version policy is
      # unchanged.
      - name: First Release Tag
        id: first-tag
        if: steps.latest-tag.outputs.GIT_LATEST_TAG == ''
        run: |
          echo "version=v$(tr -d ' \t\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      # The manifest, the tag and the feed all carry vX.Y.Z, so the computed
      # version is normalized to that form here instead of assumed.
      - name: Normalize the Tag
        id: release-tag
        env:
          COMPUTED: ${{ steps.next-tag.outputs.version || steps.first-tag.outputs.version }}
        run: |
          tag="$COMPUTED"
          case "$tag" in
            v*) ;;
            *) tag="v$tag" ;;
          esac
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_NAME: ${{ needs.prepare.outputs.release-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipmerge

      - name: Setup
        run: make setup

      - name: Build (tg5040)
        run: make tg5040
        env:
          PLATFORM: tg5040

      - name: Build (tg5050)
        run: make tg5050
        env:
          PLATFORM: tg5050

      - name: Build (h700)
        run: make h700
        env:
          PLATFORM: h700

      - name: Special
        run: make special

      # The update source: one package set per platform plus the feed, built
      # through the same entries the packaging tests drive. It runs before
      # `make package`, which moves build/SYSTEM into the bootstrap payload.
      # The manifests are unsigned; the feed carries real SHA-256 digests, and
      # the script verifies every set with the client's own integrity checks
      # before writing anything uploadable.
      - name: Prepare the update assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.next-tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.latest-tag }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The toolchain container built workspace/ as root, so the host
          # nextupd build needs a writable build directory.
          sudo mkdir -p workspace/all/nextupd/build/desktop
          sudo chown -R "$(id -u):$(id -g)" workspace/all/nextupd/build
          previous_args=""
          min_system="$RELEASE_TAG"
          if [ -n "$PREVIOUS_TAG" ]; then
            previous_args="--previous-url $SERVER_URL/$REPOSITORY/releases/download/$PREVIOUS_TAG/nextui-feed.json"
            # A card on the previous release can install this one; a card older
            # than that updates through the previous release's row, which the
            # merged feed keeps. For a first release the floor is the release
            # itself.
            min_system="$PREVIOUS_TAG"
          fi
          # shellcheck disable=SC2086
          scripts/prepare-release-update-assets.sh \
            --version "$RELEASE_TAG" \
            --min-system "$min_system" \
            --base-url "$SERVER_URL/$REPOSITORY/releases/download/$RELEASE_TAG" \
            $previous_args \
            --out-dir releases/update

      - name: Package
        run: make package

      - name: Upload All
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_NAME }}-all.zip
          path: releases/${{ env.RELEASE_NAME }}-all.zip

      - name: Upload Base
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_NAME }}-base.zip
          path: releases/${{ env.RELEASE_NAME }}-base.zip

      - name: Upload Extras
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_NAME }}-extras.zip
          path: releases/${{ env.RELEASE_NAME }}-extras.zip

      # The update assets: the per-platform sets and the feed.
      # upload-artifact roots a single-directory artifact at that directory,
      # so the artifact holds these files at its root and the release job's
      # download places them directly under releases/ (the flatten step there
      # makes the release attach them under either layout).
      - name: Upload Update Assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_NAME }}-update-assets.zip
          path: releases/update

      - name: Skip Attest for PRs from forks
        id: skip
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::warning title=Attest skipped::Attest action requires permissions and is performed only for main branch.'

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4.2.2
        if: github.ref == 'refs/heads/main'
        with:
          subject-path: |
            releases/${{ env.RELEASE_NAME }}-all.zip
            releases/${{ env.RELEASE_NAME }}-base.zip
            releases/${{ env.RELEASE_NAME }}-extras.zip
            releases/update/nextui-feed.json
            releases/update/nextui-system-*.zip
            releases/update/nextui-system-*.manifest.json

  release:
    needs:
      - build
      - prepare
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download Release Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: releases/
          pattern: NextUI-*
          merge-multiple: true

      # upload-artifact roots a single-directory artifact at that directory, so
      # the update assets arrive directly under releases/. This step makes the
      # outcome independent of that layout: if a future action version
      # preserves the update/ directory, its contents are moved up, so the
      # release step's `files: releases/*` can never silently miss the feed or
      # the update sets.
      - name: Flatten the update assets
        run: |
          if [ -d releases/update ]; then
            mv releases/update/* releases/
            rmdir releases/update
          fi

      - name: Create and Push Tag
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag "$GIT_NEXT_TAG"
          git push origin "$GIT_NEXT_TAG"
        env:
          GIT_NEXT_TAG: ${{ needs.prepare.outputs.next-tag }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/*
          generate_release_notes: true
          append_body: true
          tag_name: ${{ needs.prepare.outputs.next-tag }}
          make_latest: "true"
          body: |
            
            For full features list and help on how to use etc of NextUI:
            https://github.com/4fuu/NextUI

            ## How to install/update
            For a fresh installation, follow the instructions here: https://github.com/4fuu/NextUI/releases
            When updating from a previous release: https://github.com/4fuu/NextUI/releases
