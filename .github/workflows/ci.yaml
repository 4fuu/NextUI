---
name: CI

# yamllint disable-line rule:truthy
# Full packaging and provenance stay on main. Feature branches and pull
# requests are validated by test.yaml without producing release artifacts.
on:
  push:
    branches:
      - main

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    outputs:
      next-tag: ${{ steps.next-tag.outputs.version }}
      release-name: ${{ steps.release-name.outputs.RELEASE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate Release Name
        id: release-name
        run: |
          echo "RELEASE_NAME=$(make name)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    env:
      RELEASE_NAME: ${{ needs.prepare.outputs.release-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zipmerge

      - name: Setup
        run: make setup

      - name: Build (tg5040)
        run: make tg5040
        env:
          PLATFORM: tg5040

      - name: Build (tg5050)
        run: make tg5050
        env:
          PLATFORM: tg5050

      - name: Build (h700)
        run: make h700
        env:
          PLATFORM: h700

      - name: Special
        run: make special

      - name: Package
        run: make package

      - name: Upload All
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_NAME }}-all.zip
          path: releases/${{ env.RELEASE_NAME }}-all.zip

      - name: Upload Base
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_NAME }}-base.zip
          path: releases/${{ env.RELEASE_NAME }}-base.zip

      - name: Upload Extras
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_NAME }}-extras.zip
          path: releases/${{ env.RELEASE_NAME }}-extras.zip

      - name: Skip Attest for PRs from forks
        id: skip
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::warning title=Attest skipped::Attest action requires permissions and is performed only for main branch.'

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4.2.2
        if: github.ref == 'refs/heads/main'
        with:
          subject-path: |
            releases/${{ env.RELEASE_NAME }}-all.zip
            releases/${{ env.RELEASE_NAME }}-base.zip
            releases/${{ env.RELEASE_NAME }}-extras.zip
